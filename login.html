<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Brown Dust 2 Presets</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#171a21;--border:#2b303b;--text:#f2f4f8;--muted:#9aa3b2;--accent:#7c9cff;--danger:#ff7070}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:grid;place-items:center;padding:18px}
.login{width:min(390px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 20px 60px #0008}
h1{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:9px;background:#0f1218;color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#08101f;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.error{display:none;margin-top:14px;padding:10px;border-radius:8px;background:#3b2024;color:#ffb5b5;font-size:13px}
</style>
</head>
<body>
<main class="login">
  <h1>Brown Dust 2</h1>
  <div class="sub">Admin Panel</div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Login</button>
    <div id="error" class="error"></div>
  </form>
</main>
<script>
const form=document.getElementById("loginForm");
const btn=document.getElementById("loginBtn");
const error=document.getElementById("error");
function showError(msg){error.textContent=msg;error.style.display="block";}
form.addEventListener("submit",async e=>{
  e.preventDefault();
  error.style.display="none";
  btn.disabled=true;
  try{
    const response=await fetch("/api/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value,
        password:document.getElementById("password").value
      })
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||"Login gagal.");
    const next=new URLSearchParams(location.search).get("next");
    location.href=next&&next.startsWith("/")?next:"/admin.html";
  }catch(err){
    showError(err.message);
    btn.disabled=false;
  }
});
</script>
</body>
</html>
