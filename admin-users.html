<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Users — Brown Dust 2</title>
<style>
:root{color-scheme:dark;--bg:#0e1015;--panel:#171a21;--panel2:#1d212a;--border:#303642;--text:#f3f5f7;--muted:#9da5b2;--accent:#7c5cff;--danger:#e05252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{width:min(100%,720px);margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
a,button{font:inherit}a{color:var(--text);text-decoration:none}
button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer}
button:hover{border-color:#555e6d}button.primary{background:var(--accent);border-color:var(--accent)}button.danger{color:#ff9a9a}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.title{font-size:14px;font-weight:bold;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input{width:100%;padding:10px;background:#10131a;color:var(--text);border:1px solid var(--border);border-radius:8px}
.table{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:1fr 160px auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px}.username{font-weight:bold}.date{font-size:11px;color:var(--muted)}
.msg{font-size:12px;margin-top:10px;display:none}.msg.ok{color:#9de0ad}.msg.err{color:#ff9a9a}
@media(max-width:600px){.form{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.date{grid-column:1}.row button{grid-column:2;grid-row:1 / span 2}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Admin Users</h1><div class="sub">Manage accounts that can access the preset editor.</div></div>
  <a href="/admin.html"><button type="button">Back</button></a>
</header>
<section class="panel">
  <div class="title">Add Admin</div>
  <form id="form" class="form">
    <div><label for="username">Username</label><input id="username" required autocomplete="off"></div>
    <div><label for="password">Password</label><input id="password" type="password" required autocomplete="new-password"></div>
    <button class="primary" type="submit">Add Admin</button>
  </form>
  <div id="msg" class="msg"></div>
</section>
<section class="panel">
  <div class="title">Current Admins</div>
  <div id="users" class="table"></div>
</section>
<script>
const $=id=>document.getElementById(id);
function showMsg(text,ok){const el=$('msg');el.textContent=text;el.className='msg '+(ok?'ok':'err');el.style.display='block'}
async function load(){
  const r=await fetch('/api/admin/users',{cache:'no-store'});
  if(!r.ok){$('users').textContent='Failed to load admins.';return}
  const data=await r.json();
  $('users').innerHTML='';
  (data.users||[]).forEach(u=>{
    const row=document.createElement('div');row.className='row';
    const name=document.createElement('div');name.className='username';name.textContent=u.username;
    const date=document.createElement('div');date.className='date';date.textContent=new Date(u.created_at).toLocaleString();
    const btn=document.createElement('button');btn.className='danger';btn.textContent='Delete';btn.onclick=async()=>{
      if(!confirm('Delete admin '+u.username+'?'))return;
      const res=await fetch('/api/admin/users/'+encodeURIComponent(u.id),{method:'DELETE'});
      const body=await res.json().catch(()=>({}));
      if(!res.ok){showMsg(body.error||'Delete failed.',false);return}
      showMsg('Admin deleted.',true);load();
    };
    row.append(name,date,btn);$('users').appendChild(row);
  });
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});
  const body=await r.json().catch(()=>({}));
  if(!r.ok){showMsg(body.error||'Failed to add admin.',false);return}
  $('form').reset();showMsg('Admin berhasil ditambahkan.',true);load();
});
load();
</script>
</div>
</body>
</html>
